[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-barcode-api"
version = "0.1.0"
description = "Production-oriented MVP API for grocery and retail product barcode lookups"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3,<1",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
import-sample-data = "app.ingestion.cli:main"
import-open-food-facts = "app.ingestion.openfoodfacts:main"
sync-product-sources = "app.ingestion.sources:main"
product-source-coverage = "app.tools.product_sources:main"
barcode-coverage = "app.tools.coverage:main"
lookup-benchmark = "app.tools.performance:main"
database-quality = "app.tools.data_quality:main"
database-check = "app.tools.db_check:main"
api-key-admin = "app.tools.api_keys:main"
stripe-catalog-sync = "app.tools.stripe_catalog:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
