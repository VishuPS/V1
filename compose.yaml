services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grocery_api}
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grocery-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - grocery-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-grocery} -d ${POSTGRES_DB:-grocery_api}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grocery-postgres-data:
