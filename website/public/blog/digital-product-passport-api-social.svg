<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Digital Product Passport API developer guide</title><desc id="desc">A GTIN lookup connects a product identity layer with Digital Product Passport information.</desc>
  <rect width="1200" height="630" fill="#f5f4ed"/><path d="M0 0h16v630H0z" fill="#c8ff4d"/>
  <g fill="#171a16" font-family="Arial,sans-serif"><text x="72" y="87" font-size="24" font-weight="700">BarcodeNest / Field notes</text><text x="72" y="181" font-size="58" font-weight="700">Digital Product Passport API</text><text x="72" y="245" font-size="31">Build DPP-ready product applications</text></g>
  <g transform="translate(72 326)" font-family="Arial,sans-serif"><rect width="338" height="174" rx="8" fill="#171a16"/><text x="25" y="40" fill="#9ca398" font-size="14">REQUEST / GTIN-13</text><text x="25" y="84" fill="#c8ff4d" font-family="monospace" font-size="24">5901234123457</text><text x="25" y="132" fill="#f5f4ed" font-family="monospace" font-size="14">GET /v1/products/{gtin}</text></g>
  <g font-family="Arial,sans-serif"><text x="460" y="397" fill="#62665e" font-size="15">RESOLVE</text><text x="477" y="459" fill="#171a16" font-size="54">→</text></g>
  <g transform="translate(590 326)" font-family="Arial,sans-serif"><rect width="520" height="174" rx="8" fill="#ebeae2" stroke="#d5d4cb"/><text x="25" y="40" fill="#171a16" font-size="19" font-weight="700">MODULAR PRODUCT DATA</text><g font-size="16"><text x="25" y="83" fill="#75a300">01</text><text x="57" y="83" fill="#62665e">Identity</text><text x="180" y="83" fill="#75a300">02</text><text x="212" y="83" fill="#62665e">DPP data</text><text x="340" y="83" fill="#75a300">03</text><text x="372" y="83" fill="#62665e">Application</text></g><path d="M25 112h470" stroke="#d5d4cb"/><text x="25" y="143" fill="#62665e" font-size="14">Standard identifiers connect the layers</text></g>
  <text x="72" y="568" fill="#62665e" font-family="Arial,sans-serif" font-size="20">Identity first. Rich product data next.</text>
</svg>
