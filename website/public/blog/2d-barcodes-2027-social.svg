  <g fill="#171a16"><text x="72" y="87" font-family="Arial,sans-serif" font-size="24" font-weight="700">BarcodeNest / Field notes</text><text x="72" y="193" font-family="Arial,sans-serif" font-size="64" font-weight="700">2D barcodes in 2027</text><text x="72" y="257" font-family="Arial,sans-serif" font-size="32">Are QR codes replacing barcodes?</text></g>
